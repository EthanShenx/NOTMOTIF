[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "notmotif"
version = "0.1.0"
description = "Turn any word into a sequence-logo (motif) style image."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.5", "numpy>=1.21", "Pillow>=9.0"]
keywords = ["sequence logo", "motif", "bioinformatics", "visualization", "typography"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
notmotif = "notmotif.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notmotif = ["web/*.html"]
